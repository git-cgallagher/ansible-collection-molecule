---
# Promotes a fresh Windows Server to the first DC of a new forest. The box's
# local accounts become domain accounts on promotion, so the connection keeps
# working as the same user (PSRP + NTLM, which unlike Basic auth works for
# domain accounts).
- name: Wait for the connection
  ansible.builtin.wait_for_connection:
    timeout: 600

- name: Quiet the VM (Windows Update off, Defender real-time scanning off)
  when: ad_forest_quiet | bool
  ansible.builtin.include_role:
    name: git_cgallagher.molecule.quiet_vm

- name: Name the host
  when: ad_forest_hostname | length > 0
  block:
    - name: Set the hostname
      ansible.windows.win_hostname:
        name: "{{ ad_forest_hostname }}"
      register: ad_forest_rename

    - name: Reboot after the rename
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: ad_forest_rename.reboot_required

# Both loopbacks: promotion sets ::1 as the IPv6 DNS server itself, and
# win_dns_client converges each address family it finds, so listing only
# 127.0.0.1 would strip ::1 again on the next run and report a change.
- name: Point DNS at itself (the DC will host the domain's DNS)
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers: [127.0.0.1, '::1']

- name: Install the Windows features
  ansible.windows.win_feature:
    name: "{{ ad_forest_features }}"
    include_management_tools: true
    state: present

- name: Create the forest
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_forest_domain }}"
    domain_netbios_name: "{{ ad_forest_netbios }}"
    safe_mode_password: "{{ ad_forest_dsrm_password }}"
    install_dns: "{{ ad_forest_install_dns if ad_forest_install_dns is not none else omit }}"
    reboot: false
  register: ad_forest_result

# "Available" means the modules load and ADWS answers, plus the caller's
# test, not merely "WinRM is up". Any error must exit non-zero.
- name: Reboot and wait until AD is available
  ansible.windows.win_reboot:
    reboot_timeout: 1800
    test_command: |
      try {
      Import-Module {{ ad_forest_ready_modules | join(', ') }} -ErrorAction Stop
      $null = Get-ADDomain -ErrorAction Stop
      {{ ad_forest_ready_test }}
      exit 0
      } catch { exit 1 }
  when: ad_forest_result.reboot_required | default(false)

# The share is served at once, but \\<domain>\SYSVOL is a DFS referral and
# resolves only once the DFS namespace and DNS have caught up with the
# promotion, which lags the reboot. win_stat runs under the connection's
# token, so it resolves the UNC path the way GPMC will.
- name: Wait until the domain SYSVOL path resolves
  when: ad_forest_wait_sysvol_path | bool
  ansible.windows.win_stat:
    path: '\\{{ ad_forest_domain }}\SYSVOL\{{ ad_forest_domain }}\Policies'
  register: ad_forest_sysvol_path
  until: ad_forest_sysvol_path is succeeded and ad_forest_sysvol_path.stat.exists
  retries: 60
  delay: 10

# The account is ansible_user without a DOMAIN\ prefix (the box's local
# account became a domain account on promotion, so the sAMAccountName is the
# same). An inventory that leaves ansible_user unset (a Kerberos ticket, say)
# falls back to the name the connection runs as.
- name: Read the connection account's name when the inventory doesn't set it
  when: ansible_user is not defined
  ansible.windows.setup:
    gather_subset: ['!all', '!min', 'user']

- name: Work out the connection account's sAMAccountName
  ansible.builtin.set_fact:
    ad_forest_account: >-
      {{ (ansible_user if ansible_user is defined else ansible_facts.user_id)
         | regex_replace('^.*\\', '') }}

- name: Add the connection account to the admin groups
  microsoft.ad.group:
    identity: "{{ item }}"
    members:
      add: ["{{ ad_forest_account }}"]
  loop: "{{ ad_forest_admin_groups }}"
  register: ad_forest_groups

# The PSRP session's logon token predates the membership change.
- name: Reconnect so the new group membership is in the logon token
  ansible.builtin.meta: reset_connection

# No module sets the clock (win_timezone is the zone, not the time). The
# script measures the skew first and reports changed only when it corrects
# it; SupportsShouldProcess lets check mode predict instead of skipping.
- name: Set the DC's clock from the controller
  when: ad_forest_sync_clock | bool
  ansible.windows.win_powershell:
    parameters:
      Epoch: "{{ now(utc=true).timestamp() | int }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([long]$Epoch)
      $target = [DateTimeOffset]::FromUnixTimeSeconds($Epoch).UtcDateTime
      $skew = [math]::Abs(([DateTime]::UtcNow - $target).TotalSeconds)
      $Ansible.Result = [math]::Round($skew)
      $Ansible.Changed = $skew -gt 30
      if ($Ansible.Changed -and -not $Ansible.CheckMode) { Set-Date -Date $target.ToLocalTime() | Out-Null }
  register: ad_forest_clock

# The feature install and the two reboots re-arm the Windows Update service
# (the servicing stack starts it and resets its start mode; CI's windows_dc
# idempotence step showed it), so the VM is quieted again at the end. The
# first run reports the re-quiet as changed, which it is; a second run finds
# both calls quiet.
- name: Quiet the VM again after the promotion
  when: ad_forest_quiet | bool
  ansible.builtin.include_role:
    name: git_cgallagher.molecule.quiet_vm
