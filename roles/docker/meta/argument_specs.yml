---
argument_specs:
  main:
    short_description: Create a docker-kind platform (alias of the create entry point)
    options: &docker_options
      testlab_platform:
        type: dict
        required: true
        description:
          - One Molecule platform of kind C(docker). Keys follow molecule-plugins' docker driver;
            the supported set is C(docker_platform_keys) in C(vars/main.yml), and any other key fails.
  create:
    short_description: Pull or build the image, create networks, start the container and append its entry to C(docker_instances)
    options: *docker_options
  destroy:
    short_description: Remove the container, and its networks once nothing uses them
    options: *docker_options
