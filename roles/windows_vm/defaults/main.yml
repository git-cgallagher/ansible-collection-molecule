---
# Input (the kind contract, set by git_cgallagher.molecule.create/destroy):
# molecule_platform, one entry of molecule_platforms (molecule.yml's platforms
# over the driver's platform_defaults). Its keys are listed in vars/main.yml.

# Box cache, VM disk, pidfile and monitor socket. Needs ~20 GB free while the
# box isn't cached, ~8 GB after (CI sets MOLECULE_LAB_DIR, see
# .github/workflows/windows-lab.yml).
windows_vm_dir: "{{ molecule_lab_dir | default(lookup('ansible.builtin.env', 'HOME') ~ '/.cache/molecule-lab', true) }}"

# QEMU's -name, and the prefix ps/top show for the VM process.
windows_vm_name_prefix: molecule

# Keys the lab network hub ports and NIC MAC addresses: scenarios running at
# the same time on one host get different hubs.
windows_vm_scenario_key: "{{ molecule_scenario_directory | default(lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY'), true) }}"

# Seconds the box's first boot (OOBE, licence rearm, reboot, WinRM reset) may
# take, counted once for all of a scenario's VMs, from when they start. A
# healthy boot takes 3-10 minutes; a VM whose QEMU exits or whose guest stops
# fails at the next poll (10 s apart) instead. windows_vm_first_boot_retries,
# the poll count before 0.4.0, still works: it means that many 10 s polls.
windows_vm_first_boot_timeout: "{{ (windows_vm_first_boot_retries | int * 10) if windows_vm_first_boot_retries is defined else 1800 }}"

# QEMU's -cpu: the host's CPU, plus the Hyper-V enlightenments Windows uses on
# KVM. AGENTS.md ("A windows_vm guest can freeze ...") has what was tried.
windows_vm_cpu: host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time

# The watchdog (files/vm_watch.py, run by the QEMU supervisor): a guest that
# makes no progress for this many seconds (no disk I/O and no answer on its
# WinRM port) while QEMU says it runs gets a verdict and a capture (screen,
# vCPUs, KVM counters, APICs) in <platform>-qemu.log, and fails the first-boot
# wait at once. It only reports: the VM keeps running. 0 turns it off.
windows_vm_watchdog_timeout: 180

# After a stall's capture, inject an NMI and take a second screen 15 s later
# (<platform>-nmi-screen.ppm). The stuck guest bugchecks and reboots, and may
# stall again while booting: for investigating a stall, so off by default.
windows_vm_watchdog_nmi: false
