---
# One hub (files/lab_hub.py) per lab network, started by the first of its VMs
# to be created; the others find it running. destroy.yml stops it.
- name: Look for running lab network hubs
  ansible.builtin.command:
    expand_argument_vars: false
    argv: [sh, -c, 'kill -0 "$(cat "$1" 2>/dev/null)" 2>/dev/null', sh, "{{ item.hub_pidfile }}"]
  loop: "{{ windows_vm_lab_nics }}"
  loop_control:
    label: "{{ item.name }} (hub 127.0.0.1:{{ item.hub_port }})"
  register: windows_vm_hub_check
  changed_when: false
  failed_when: false

- name: Start the lab network hubs that aren't running
  ansible.builtin.command:
    expand_argument_vars: false
    argv: >-
      {{ [ansible_playbook_python, role_path ~ '/files/lab_hub.py', '--hub', item.item.hub_port | string,
          '--pidfile', item.item.hub_pidfile]
         + (item.item.member_ports | map('string') | map('regex_replace', '^', '--member=') | list) }}
  loop: "{{ windows_vm_hub_check.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }} (hub 127.0.0.1:{{ item.item.hub_port }}, members {{ item.item.member_ports | join(', ') }})"
  changed_when: true
