---
argument_specs:
  main:
    short_description: Boot a windows_vm-kind platform (alias of the create entry point)
    options: &windows_vm_options
      molecule_platform:
        type: dict
        required: true
        description:
          - One Molecule platform of kind C(windows_vm). Required keys are C(name), C(box_url),
            C(box_sha256), C(box_user), C(box_password) and C(winrm_port); optional C(memory_mb)
            (default 4096), C(cpus) (default 2), C(forwards), a list of C({port, guest_port, protocols}), and
            C(lab_networks), a list of C({name, ipv4_address, prefix_length}) shared with the scenario's other
            VMs on the same network name. Any other key fails (C(windows_vm_platform_keys) in C(vars/main.yml)).
      molecule_platforms:
        type: list
        elements: dict
        required: true
        description:
          - Every platform in the run, after the driver's C(platform_defaults) (set by the create/destroy
            playbooks). Read for the host-port and lab-address checks and each lab network's members.
      windows_vm_dir:
        type: path
        description:
          - Box cache, VM disk, pidfile, QEMU monitor socket and C(<platform>-qemu.log) (QEMU's output and how it
            stopped; destroy keeps it).
          - Defaults to C(molecule_lab_dir) (set by the create/destroy playbooks), else C(~/.cache/molecule-lab).
      windows_vm_name_prefix:
        type: str
        default: molecule
        description: Prefix of the QEMU process name.
      windows_vm_first_boot_timeout:
        type: int
        default: 1800
        description:
          - Seconds the box's first boot (OOBE, licence rearm, reboot, WinRM reset) may take, counted once for all
            of a scenario's VMs from when they start; polled 10 s apart. A VM whose QEMU exits or whose guest stops
            (powers off, pauses on an error) fails at the next poll instead.
          - Defaults to C(windows_vm_first_boot_retries) x 10 when that is set, else 1800.
      windows_vm_first_boot_retries:
        type: int
        description:
          - Deprecated since 0.4.0 (it was the poll count); use C(windows_vm_first_boot_timeout). When set, it
            means that many 10 s polls.
      windows_vm_cpu:
        type: str
        default: host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time
        description:
          - QEMU's C(-cpu) for every VM, the host's CPU plus the Hyper-V enlightenments Windows uses on KVM.
      windows_vm_watchdog_timeout:
        type: int
        default: 180
        description:
          - Seconds a guest may make no progress (no disk I/O and no answer on its WinRM port) while QEMU reports it
            running, before the supervisor's watchdog records a stall in C(<platform>-qemu.log) with a capture (the
            screen as C(<platform>-stalled-screen.ppm), vCPU threads, KVM counters, registers, local APICs). A stall
            during the first boot ends the wait at once. The watchdog only reports; the VM keeps running.
          - C(0) turns the watchdog off.
      windows_vm_watchdog_nmi:
        type: bool
        default: false
        description:
          - After a stall's capture, inject an NMI and take another screen a minute later
            (C(<platform>-nmi-screen.ppm)). A guest that can still run code bugchecks, so this ends the guest; for
            investigating a stall.
  create:
    short_description: Boot a Windows box under QEMU/KVM and append its entry to C(windows_vm_instances)
    options: *windows_vm_options
  ready:
    short_description: Wait for the box's first boot, then configure its lab NICs
    options: *windows_vm_options
  destroy:
    short_description: Stop the VM and remove its disk (the box cache stays)
    options: *windows_vm_options
