---
# Quiet a throwaway Windows test VM: Windows Update and Defender real-time
# scanning compete with a test run for CPU and disk, and Windows Update can
# reboot the VM under it.
- name: Quiet Windows Update
  when: quiet_vm_windows_update | bool
  block:
    - name: Disable and stop Windows Update
      ansible.builtin.include_tasks: wuauserv.yml

    # Shortly after boot, Windows Update Medic repairs a disabled wuauserv
    # (start mode back to manual, service started) when something asks for
    # it, and nothing an administrator can do over the connection prevents
    # that (its service config is protected, a registry change waits for a
    # reboot). It has been a one-shot repair, so the role waits it out:
    # after a pass that changed something, it settles, reads the service
    # back, and runs the pass once more if Windows re-armed it.
    - name: Wait out a Windows Update repair
      when:
        - not ansible_check_mode
        - quiet_vm_wuauserv_disable is changed or quiet_vm_wuauserv_stop is changed
      block:
        - name: Give Windows Update Medic time to react
          ansible.builtin.pause:
            seconds: "{{ quiet_vm_settle_seconds }}"

        - name: Read Windows Update back
          ansible.windows.win_service_info:
            name: wuauserv
          register: quiet_vm_wuauserv_after

        # Cacheable, like quiet_vm_wuauserv_stopped below, for a later
        # verify. A refused stop (still running, warned) isn't a re-arm.
        - name: Record whether Windows re-armed Windows Update
          ansible.builtin.set_fact:
            quiet_vm_wuauserv_rearmed: >-
              {{ quiet_vm_wuauserv_after.services[0].start_mode != 'disabled'
                 or (quiet_vm_wuauserv_stop is succeeded and quiet_vm_wuauserv_after.services[0].state != 'stopped') }}
            cacheable: true

        - name: Disable and stop Windows Update again
          when: quiet_vm_wuauserv_rearmed | bool
          ansible.builtin.include_tasks: wuauserv.yml

    # Cacheable, so a later playbook with a fact cache (a Molecule verify) can
    # tell a warned stop from a regression.
    - name: Record whether Windows Update stopped
      ansible.builtin.set_fact:
        quiet_vm_wuauserv_stopped: "{{ quiet_vm_wuauserv_stop is succeeded }}"
        cacheable: true

# No module covers Set-MpPreference. The script reads the preference first
# and only writes when it differs, then reads it back: with Defender Tamper
# Protection on, the write is silently ignored, so changed is set only when
# the value flipped, and a write that didn't take is a warning (not a
# failure, so a lab with Defender on still runs) rather than a change
# reported on every run. SupportsShouldProcess makes win_powershell run it in
# check mode, where it predicts from the current value. A VM without Defender
# is a no-op. output[0] has the state read back.
- name: Turn off Defender real-time scanning
  when: quiet_vm_defender | bool
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      $Ansible.Changed = $false
      if (-not (Get-Command -Name Get-MpPreference -ErrorAction SilentlyContinue)) {
          [ordered]@{ defender = $false; realtime_disabled = $null; tamper_protected = $null }
          return
      }
      $before = [bool](Get-MpPreference -ErrorAction Stop).DisableRealtimeMonitoring
      $after = $before
      if (-not $before) {
          if ($Ansible.CheckMode) {
              $Ansible.Changed = $true
          }
          else {
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
              $after = [bool](Get-MpPreference -ErrorAction Stop).DisableRealtimeMonitoring
              $Ansible.Changed = $after
              if (-not $after) {
                  Write-Warning 'Set-MpPreference -DisableRealtimeMonitoring was ignored (Defender Tamper Protection is on); real-time scanning stays on'
              }
          }
      }
      [ordered]@{ defender = $true; realtime_disabled = $after; tamper_protected = (-not $before -and -not $after -and -not $Ansible.CheckMode) }
