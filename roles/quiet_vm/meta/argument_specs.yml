---
argument_specs:
  main:
    short_description: Quiet a throwaway Windows test VM
    description:
      - For lab VMs only. Stops and disables the Windows Update service and turns off Defender
        real-time scanning, so a test run isn't slowed or interrupted by either. Each task reports
        C(changed) only when it changed the VM, and both predict in check mode.
      - Used by C(git_cgallagher.molecule.ad_forest) (C(ad_forest_quiet)) and meant for the prepare
        playbooks of workgroup labs that don't promote a DC.
    options:
      quiet_vm_windows_update:
        type: bool
        default: true
        description:
          - Set the C(wuauserv) service's start mode to C(disabled), then stop it, retrying while it
            is starting or stopping after first boot.
          - If Windows still refuses the stop, the task warns instead of failing (the service stays
            disabled but running); any other error fails.
          - Sets the cacheable fact C(quiet_vm_wuauserv_stopped), C(false) when the stop was refused.
          - Waits out a Windows Update Medic repair (see C(quiet_vm_settle_seconds)).
      quiet_vm_stop_retries:
        type: int
        default: 10
        description: How many times the C(wuauserv) stop is tried.
      quiet_vm_stop_delay:
        type: int
        default: 6
        description: Seconds between C(wuauserv) stop attempts.
      quiet_vm_settle_seconds:
        type: int
        default: 15
        description:
          - After a pass that changed C(wuauserv), seconds to wait before reading it back. Windows
            Update Medic can re-enable and start a disabled C(wuauserv) shortly after boot; if it
            did, the role disables and stops it once more and sets the cacheable fact
            C(quiet_vm_wuauserv_rearmed).
      quiet_vm_defender:
        type: bool
        default: true
        description:
          - Set Defender's C(DisableRealtimeMonitoring) preference. A VM without Defender (no
            C(Get-MpPreference)) is left alone, and on one whose Tamper Protection ignores the write
            the task warns instead of reporting a change; both are reported in the task's C(output).
