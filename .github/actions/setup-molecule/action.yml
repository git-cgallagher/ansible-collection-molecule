name: Set up Molecule with the molecule-git-cgallagher driver
description: >-
  Python, ansible-core, Molecule, the molecule-git-cgallagher driver and the
  git_cgallagher.molecule collection (both from this action's own ref, so one
  SHA pin versions all three), plus a collection's test requirements, from an
  ansible-runtime image or from Galaxy. Exposes the checkout as
  <namespace>.<name> for Molecule; optionally enables KVM and QEMU and a lab
  directory for windows_vm platforms.
inputs:
  collection:
    description: The checked-out collection's FQCN (namespace.name), linked into .molecule-collections. Empty for a standalone role.
    required: false
    default: ''
  collections-image:
    description: >-
      An ansible-runtime -ci image (the caller's RUNTIME_IMAGE, tag@sha256:digest) to take the
      collections from instead of Galaxy. Every collection in the image except
      git_cgallagher.molecule is copied into the first collections path (~/.ansible/collections),
      and every ansible-galaxy call runs --offline, so `requirements` become a check: a collection
      or version the image lacks fails the step. Nothing is downloaded from Galaxy. An image with
      other git_cgallagher collections (the runtime target) is refused. Empty: Galaxy.
    required: false
    default: ''
  requirements:
    description: >-
      Collection requirement files, one per line: installed from Galaxy, or with
      collections-image, checked against the image's collections.
    required: false
    default: ''
  pip:
    description: Extra pip packages, space-separated.
    required: false
    default: ''
  ansible-core:
    description: The ansible-core pip spec.
    required: false
    default: ansible-core
  constraints:
    description: >-
      A pip constraints file in the checkout (pip install -c), applied to every
      package this action installs, so CI runs the versions the repo pins. Empty for none.
    required: false
    default: ''
  python-version:
    description: Python for the controller.
    required: false
    default: '3.13'
  kvm:
    description: >-
      'true' to enable /dev/kvm for the runner user and install QEMU and pypsrp (windows_vm
      platforms). QEMU's packages come from the actions cache when it has them (each checked against
      its SHA256 in the signed package lists), else from the Ubuntu mirrors: apt-get takes 10 minutes
      at most in all, and an update or download too slow for its limit moves to the next mirror.
    required: false
    default: 'false'
  lab-dir:
    description: >-
      If set, create this directory (owned by the runner user) and export it as
      MOLECULE_LAB_DIR. windows_vm needs ~20 GB free there while the box isn't cached. On
      ubuntu-latest /mnt is a directory on the root filesystem, not a disk of its own, and some
      runners come up with ~16 GB free: run a "Make room for the lab" step first, which frees room
      and picks the directory (this repository's .github/workflows/windows-lab.yml has one).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    # QEMU (18.6 MB of .debs on ubuntu-24.04) comes from the cache when it can.
    # The key is the exact files apt would download, so a hit downloads nothing
    # and a new QEMU build, or a runner image that needs other files, misses.
    # Every apt-get has its own limit, since a caller can only limit this whole
    # action: update 1 min, download 2, install 2. An update or a download that
    # times out gets one more try (1 and 4 min) without the mirror apt tried
    # first: from westus2 the Azure mirror has sent .debs at 40 kB/s. 10 min at
    # most in all (apt_install.sh).
    - name: Enable KVM and list QEMU's packages
      id: qemu
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        "$GITHUB_ACTION_PATH/apt_install.sh" list "$RUNNER_TEMP/setup-molecule-apt" qemu-system-x86 qemu-utils

    # A stuck cache download gives up after 2 minutes (actions/cache's default
    # is 10) and counts as a miss.
    - name: Restore QEMU's packages from the cache
      id: qemu-cache
      if: inputs.kvm == 'true' && steps.qemu.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ${{ runner.temp }}/setup-molecule-apt/debs
        key: ${{ steps.qemu.outputs.key }}

    - name: Install QEMU
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/apt_install.sh" install "$RUNNER_TEMP/setup-molecule-apt" qemu-system-x86 qemu-utils
        ls -l /dev/kvm

    # Right after the download, not at the end of the job: a lab that fails
    # later still leaves the cache for the next run.
    - name: Save QEMU's packages to the cache
      if: inputs.kvm == 'true' && steps.qemu.outputs.key != '' && steps.qemu-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/setup-molecule-apt/debs
        key: ${{ steps.qemu.outputs.key }}

    - name: Prepare the lab directory
      if: inputs.lab-dir != ''
      shell: bash
      env:
        LAB_DIR: ${{ inputs.lab-dir }}
      run: |
        sudo mkdir -p "$LAB_DIR"
        sudo chown "$USER" "$LAB_DIR"
        echo "MOLECULE_LAB_DIR=$LAB_DIR" >> "$GITHUB_ENV"
        df -h "$LAB_DIR" /

    # What the lab's guests run on: the runner's VM size and CPU, its kernel, the
    # TSC features and clocksource nested guests' clocks rest on, the KVM
    # parameters, and the kernel's notes on Hyper-V (its build) and the TSC. A
    # lab failure can then be matched to the hardware. With lab-dir, also in
    # <lab-dir>/host-info.txt.
    - name: Record the host
      if: inputs.kvm == 'true'
      shell: bash
      env:
        LAB_DIR: ${{ inputs.lab-dir }}
      run: |
        "$GITHUB_ACTION_PATH/host_info.sh" ${LAB_DIR:+"$LAB_DIR/host-info.txt"}

    # The action's own checkout is the whole repository at the pinned ref:
    # the driver (pyproject.toml) and the collection (galaxy.yml) come from it.
    # With collections-image the image's collections go in first: installing
    # git_cgallagher.molecule resolves its galaxy.yml dependencies, which would
    # otherwise come from Galaxy too. --offline turns a missing one into an error.
    - name: Install Ansible, Molecule, the driver and the collections
      shell: bash
      env:
        CORE: ${{ inputs.ansible-core }}
        CONSTRAINTS: ${{ inputs.constraints }}
        EXTRA: ${{ inputs.pip }}
        IMAGE: ${{ inputs.collections-image }}
        KVM: ${{ inputs.kvm }}
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        root=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        driver=$root; [ "$KVM" = true ] && driver="$root[windows]"
        read -ra extra <<< "$EXTRA"
        constraints=()
        if [ -n "$CONSTRAINTS" ]; then constraints=(-c "$CONSTRAINTS"); fi
        pip install "${constraints[@]}" "$CORE" molecule "$driver" "${extra[@]}"
        molecule --version
        if [ -z "$IMAGE" ]; then
          ansible-galaxy collection install --force "$root"
          while IFS= read -r req; do
            if [ -n "$req" ]; then
              ansible-galaxy collection install -r "$req"
            fi
          done <<< "$REQUIREMENTS"
        else
          # Where ansible-galaxy installs: the first collections path.
          dest=$(python -c 'from ansible import constants as C; print(C.COLLECTIONS_PATHS[0])')
          "$GITHUB_ACTION_PATH/image_collections.sh" "$IMAGE" "$dest"
          if ! ansible-galaxy collection install --offline --force "$root"; then
            echo "::error::$IMAGE lacks a collection git_cgallagher.molecule depends on (its galaxy.yml; see above)."
            exit 1
          fi
          while IFS= read -r req; do
            if [ -n "$req" ] && ! ansible-galaxy collection install --offline -r "$req"; then
              echo "::error::$req needs a collection or version that $IMAGE lacks (see above)." \
                "Pin it in ansible-runtime's requirements/collections.yml first:" \
                "with collections-image, nothing comes from Galaxy."
              exit 1
            fi
          done <<< "$REQUIREMENTS"
        fi
        ansible-galaxy collection list

    # Molecule runs the roles as <namespace>.<name>.<role>; the base config's
    # ANSIBLE_COLLECTIONS_PATH puts .molecule-collections first.
    - name: Expose the checkout as ${{ inputs.collection }}
      if: inputs.collection != ''
      shell: bash
      env:
        FQCN: ${{ inputs.collection }}
      run: |
        ns=${FQCN%%.*}; name=${FQCN#*.}
        mkdir -p ".molecule-collections/ansible_collections/$ns"
        ln -sfn ../../.. ".molecule-collections/ansible_collections/$ns/$name"
