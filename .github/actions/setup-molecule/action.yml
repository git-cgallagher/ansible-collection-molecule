name: Set up Molecule with the molecule-git-cgallagher driver
description: >-
  Python, ansible-core, Molecule, the molecule-git-cgallagher driver and the
  git_cgallagher.molecule collection (both from this action's own ref, so one
  SHA pin versions all three), plus a collection's test requirements, from an
  ansible-runtime image or from Galaxy. Exposes the checkout as
  <namespace>.<name> for Molecule; optionally enables KVM and QEMU and a lab
  directory on the runner's large /mnt disk for windows_vm platforms.
inputs:
  collection:
    description: The checked-out collection's FQCN (namespace.name), linked into .molecule-collections. Empty for a standalone role.
    required: false
    default: ''
  collections-image:
    description: >-
      An ansible-runtime image (the caller's RUNTIME_IMAGE, tag@sha256:digest) to take the
      collections from instead of Galaxy. Every collection in the image except
      git_cgallagher.molecule is copied into the first collections path (~/.ansible/collections),
      and every ansible-galaxy call runs --offline, so `requirements` become a check: a collection
      or version the image lacks fails the step. Nothing is downloaded from Galaxy. Empty: Galaxy.
    required: false
    default: ''
  requirements:
    description: >-
      Collection requirement files, one per line: installed from Galaxy, or with
      collections-image, checked against the image's collections.
    required: false
    default: ''
  pip:
    description: Extra pip packages, space-separated.
    required: false
    default: ''
  ansible-core:
    description: The ansible-core pip spec.
    required: false
    default: ansible-core
  constraints:
    description: >-
      A pip constraints file in the checkout (pip install -c), applied to every
      package this action installs, so CI runs the versions the repo pins. Empty for none.
    required: false
    default: ''
  python-version:
    description: Python for the controller.
    required: false
    default: '3.13'
  kvm:
    description: "'true' to enable /dev/kvm for the runner user and install QEMU and pypsrp (windows_vm platforms)."
    required: false
    default: 'false'
  lab-dir:
    description: >-
      If set, create this directory (owned by the runner user) and export it as
      MOLECULE_LAB_DIR. windows_vm needs ~20 GB, more than the root filesystem has; use /mnt/....
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    # apt-get gets its own time limits because a caller can only limit this
    # whole action (a composite action's steps can't set timeout-minutes): a
    # stuck apt once hung a consumer's job for two hours. Each call normally
    # takes well under a minute.
    - name: Enable KVM and install QEMU
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        # apt_get <seconds> <apt-get args>: fail instead of hanging past the limit.
        apt_get() {
          local limit=$1
          shift
          sudo timeout --kill-after=30 "$limit" apt-get "$@" && return 0
          local rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::apt-get $1 didn't finish in $((limit / 60)) minutes (a stuck mirror or dpkg lock?); re-run the job."
          fi
          return "$rc"
        }
        apt_get 180 update
        apt_get 480 install -y --no-install-recommends qemu-system-x86 qemu-utils
        ls -l /dev/kvm

    - name: Prepare the lab directory
      if: inputs.lab-dir != ''
      shell: bash
      env:
        LAB_DIR: ${{ inputs.lab-dir }}
      run: |
        sudo mkdir -p "$LAB_DIR"
        sudo chown "$USER" "$LAB_DIR"
        echo "MOLECULE_LAB_DIR=$LAB_DIR" >> "$GITHUB_ENV"
        df -h "$LAB_DIR" /

    # The action's own checkout is the whole repository at the pinned ref:
    # the driver (pyproject.toml) and the collection (galaxy.yml) come from it.
    # With collections-image the image's collections go in first: installing
    # git_cgallagher.molecule resolves its galaxy.yml dependencies, which would
    # otherwise come from Galaxy too. --offline turns a missing one into an error.
    - name: Install Ansible, Molecule, the driver and the collections
      shell: bash
      env:
        CORE: ${{ inputs.ansible-core }}
        CONSTRAINTS: ${{ inputs.constraints }}
        EXTRA: ${{ inputs.pip }}
        IMAGE: ${{ inputs.collections-image }}
        KVM: ${{ inputs.kvm }}
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        root=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        driver=$root; [ "$KVM" = true ] && driver="$root[windows]"
        read -ra extra <<< "$EXTRA"
        constraints=()
        if [ -n "$CONSTRAINTS" ]; then constraints=(-c "$CONSTRAINTS"); fi
        pip install "${constraints[@]}" "$CORE" molecule "$driver" "${extra[@]}"
        molecule --version
        if [ -z "$IMAGE" ]; then
          ansible-galaxy collection install --force "$root"
          while IFS= read -r req; do
            if [ -n "$req" ]; then
              ansible-galaxy collection install -r "$req"
            fi
          done <<< "$REQUIREMENTS"
        else
          # Where ansible-galaxy installs: the first collections path.
          dest=$(python -c 'from ansible import constants as C; print(C.COLLECTIONS_PATHS[0])')
          "$GITHUB_ACTION_PATH/image_collections.sh" "$IMAGE" "$dest"
          if ! ansible-galaxy collection install --offline --force "$root"; then
            echo "::error::$IMAGE lacks a collection git_cgallagher.molecule depends on (its galaxy.yml; see above)."
            exit 1
          fi
          while IFS= read -r req; do
            if [ -n "$req" ] && ! ansible-galaxy collection install --offline -r "$req"; then
              echo "::error::$req needs a collection or version that $IMAGE lacks (see above)." \
                "Pin it in ansible-runtime's requirements/collections.yml first:" \
                "with collections-image, nothing comes from Galaxy."
              exit 1
            fi
          done <<< "$REQUIREMENTS"
        fi
        ansible-galaxy collection list

    # Molecule runs the roles as <namespace>.<name>.<role>; the base config's
    # ANSIBLE_COLLECTIONS_PATH puts .molecule-collections first.
    - name: Expose the checkout as ${{ inputs.collection }}
      if: inputs.collection != ''
      shell: bash
      env:
        FQCN: ${{ inputs.collection }}
      run: |
        ns=${FQCN%%.*}; name=${FQCN#*.}
        mkdir -p ".molecule-collections/ansible_collections/$ns"
        ln -sfn ../../.. ".molecule-collections/ansible_collections/$ns/$name"
