name: Capture a windows_vm screen
description: >-
  Ask windows_vm platforms' QEMU monitors for their run state and a screendump
  each (PPM, as <platform>-screen.ppm in the lab directory), and print the end
  of each platform's QEMU log (<platform>-qemu.log: the host it ran on, QEMU's
  output and how it stopped), for a failed run's diagnostics. A guest the
  driver's watchdog found making no progress gets an error annotation, and its
  capture (screen as <platform>-stalled-screen.ppm, vCPUs, KVM counters, APICs)
  is printed whole. Never fails the job.
inputs:
  lab-dir:
    description: The lab directory (MOLECULE_LAB_DIR).
    required: true
  platforms:
    description: The windows_vm platforms' names, space-separated (each monitor socket is <lab-dir>/<platform>-monitor.sock).
    required: true
runs:
  using: composite
  steps:
    # nc needs -N (close on stdin EOF) and a timeout: the QEMU monitor keeps
    # the socket open, so plain `nc -U` never exits (hung a run for 30 min).
    # The reply is captured first and judged after: under the step's pipefail,
    # a `|| echo` on the pipeline would also fire when nc timed out after
    # answering.
    - name: Capture the VM screens
      shell: bash
      env:
        LAB_DIR: ${{ inputs.lab-dir }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        for platform in $PLATFORMS; do
          echo "::group::$platform"
          sock="$LAB_DIR/$platform-monitor.sock"
          if [ -S "$sock" ]; then
            reply=$({ printf 'info status\nscreendump %s/%s-screen.ppm\n' "$LAB_DIR" "$platform"; sleep 3; } \
              | timeout 20 nc -N -U "$sock" 2>&1 || true)
            status=$(printf '%s\n' "$reply" | tr -d '\r' | grep -a -o 'VM status: .*' | head -n 1 || true)
            echo "$platform: ${status:-no answer from the monitor (QEMU gone?)}"
          else
            echo "$platform: no monitor socket"
          fi
          log="$LAB_DIR/$platform-qemu.log"
          if [ -f "$log" ]; then
            grep -a -m 1 'qemu-supervisor: host:' "$log" || true
            echo "--- end of $log"
            tail -n 40 "$log"
          fi
          echo "::endgroup::"
          # The driver's watchdog (roles/windows_vm/files/vm_watch.py): each
          # verdict, then its capture in full (the tail above may cut it).
          if [ -f "$log" ] && grep -a -q 'watchdog: the guest made no progress' "$log"; then
            verdict=$(grep -a -m 1 'watchdog: the guest made no progress' "$log" | sed 's/^.*watchdog: //')
            echo "::error title=$platform made no progress::$platform: $verdict (capture in $platform-qemu.log)"
            echo "::group::$platform: the watchdog's capture"
            sed -n '/watchdog: the guest made no progress/,/watchdog: end of the capture/p' "$log"
            grep -a 'watchdog: the guest is making progress again' "$log" || true
            echo "::endgroup::"
          fi
        done
        ls -la "$LAB_DIR" || true
