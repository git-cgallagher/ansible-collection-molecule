# Keeps the SHA-pinned actions in .github/workflows and .github/actions current.
# Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-molecule, /.github/actions/vm-screendump]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
