name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: catches Molecule, ansible-core and image changes.
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Every tool version this repo's CI uses (lint, molecule, windows-lab.yml) comes from this
  # image's /usr/share/ansible-runtime/constraints.txt (ansible-runtime's shared dependency
  # model, ansible-runtime#8): the versions every consumer runs the driver with. Its
  # collections, too: setup-molecule copies them out of it (collections-image), and those
  # jobs run with Galaxy unreachable. Upstream breakage shows up through ansible-runtime's
  # Renovate bumps, whose consumers job runs Molecule. Only the ansible-test sanity matrix
  # picks its own versions. Bump tag AND digest.
  RUNTIME_IMAGE: ghcr.io/git-cgallagher/ansible-runtime:1.4.0-ci@sha256:317d54cc761728def24cb28e4b150954a3816c2bb0091ccdc03add25150335c8

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Python packages and collections at the versions of the ansible-runtime image
      # (RUNTIME_IMAGE in ci.yml): its constraints.txt and its collections, the same ansible-core,
      # Molecule, linters, pypsrp and collections every consumer runs. This repo's CI never runs
      # IN the image (it would test the baked driver).
      - name: Read the ansible-runtime image's pins
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      # Nothing in this job may download a collection (they come from RUNTIME_IMAGE): anything
      # that still tries fails instead of quietly depending on Galaxy.
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collections-image: ${{ env.RUNTIME_IMAGE }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
          pip: ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint

  sanity:
    name: sanity (${{ matrix.ansible-core-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ansible-core-version: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: sanity

  # The driver end to end on Docker: scenarios with only platforms in their
  # molecule.yml, set up by this repo's own setup-molecule action.
  molecule:
    name: molecule ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [docker_smoke, docker_full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Python packages and collections at the versions of the ansible-runtime image
      # (RUNTIME_IMAGE in ci.yml): its constraints.txt and its collections, the same ansible-core,
      # Molecule, linters, pypsrp and collections every consumer runs. This repo's CI never runs
      # IN the image (it would test the baked driver).
      - name: Read the ansible-runtime image's pins
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      # As in lint: Molecule's dependency step and prerun must find everything installed.
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collection: git_cgallagher.molecule
          collections-image: ${{ env.RUNTIME_IMAGE }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
      - run: molecule test -s ${{ matrix.scenario }}
