name: windows-lab

# The windows_vm kind end to end, on QEMU/KVM on the runner:
#   windows_dc       a Windows Server 2022 VM promoted to a new forest with
#                    Microsoft DNS by ad_forest; a host-network container
#                    queries it through the forwarded port.
#   windows_cluster  two VMs booted side by side on one lab network; each
#                    reaches the other over it.
# About 15-25 min each, in parallel. And, in a few minutes without a box:
#   lifecycle        QEMU under files/qemu_supervisor.py and each answer of
#                    files/first_boot_poll.py, against a disk-less QEMU
#                    (.github/ci/windows_vm_lifecycle.sh).
#
# Every job takes its collections from the ansible-runtime image (RUNTIME_IMAGE
# in ci.yml, through setup-molecule's collections-image) and runs with Galaxy
# unreachable, so nothing in it can download a collection.
#
# Not a required check: it is path-filtered (a required check that doesn't
# run blocks merges forever) and depends on a third-party box download.

on:
  pull_request:
    paths:
      - roles/windows_vm/**
      - roles/ad_forest/**
      - roles/quiet_vm/**
      - roles/docker/**
      - playbooks/**
      - molecule_git_cgallagher/**
      - extensions/molecule/windows_dc/**
      - extensions/molecule/windows_cluster/**
      - extensions/molecule/tasks/**
      - .github/actions/**
      - .github/ci/windows_vm_lifecycle.sh
      - .github/workflows/windows-lab.yml
  # Weekly: catches box and runner-image changes (collections change only with RUNTIME_IMAGE).
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: windows-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output (retry lines included) instead of buffering it
  # until the play ends; a stalled step is then visible in the live log.
  PYTHONUNBUFFERED: '1'
  # The driver keeps the box (~6 GB, plus ~6 GB while unpacking), the VM disks,
  # the lab network hubs' pidfiles and the QEMU logs here. On ubuntu-latest
  # /mnt is a directory on the root filesystem, not a disk of its own. The
  # molecule job's "Make room for the lab" step moves the lab when /mnt is
  # short of room (the lifecycle job boots no box and needs no room).
  MOLECULE_LAB_DIR: /mnt/molecule-lab

jobs:
  molecule:
    name: molecule ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: windows_dc
            platforms: dc01
          - scenario: windows_cluster
            platforms: node1 node2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The driver refuses to create a VM with under 20 GB free in the lab
      # directory (roles/windows_vm/tasks/create.yml, measured with df -Pk, as
      # here).
      # Most runners have about 85 GB free on / (145 GB, /dev/root), but some
      # come up with a 72 GB root (/dev/mapper/cow-root) and about 16 GB free
      # (git-cgallagher/ansible-collection-windows#62,
      # actions/runner-images#15238). Then this step deletes big preinstalled
      # toolchains the lab never uses (about 25 GB, in one to three minutes)
      # and moves the lab to a directory on /: the same disk as /mnt today, the
      # right one if /mnt is ever a small disk of its own. The later steps read
      # the new path from ${{ env.MOLECULE_LAB_DIR }}. NEED_GB leaves margin
      # over the driver's 20 GB, part of which the image pull, apt and pip
      # below use. The bigger lab, windows_cluster's two VMs, ends at under
      # 9 GB (2026-11-05), so the driver's check is what has to pass.
      - name: Make room for the lab
        timeout-minutes: 10
        env:
          NEED_GB: '30'
        run: |
          avail_kb() { df -Pk "$1" | awk 'NR == 2 {print $4}'; }
          gb() { awk -v kb="$1" 'BEGIN {printf "%.1f", kb / 1048576}'; }
          need_kb=$((NEED_GB * 1048576))
          lab=$MOLECULE_LAB_DIR
          df -h / /mnt
          if [ "$(avail_kb /mnt)" -lt "$need_kb" ]; then
            echo "/mnt has $(gb "$(avail_kb /mnt)") GB free, under $NEED_GB GB. Deleting from /:"
            for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /opt/hostedtoolcache/CodeQL /usr/share/swift; do
              [ -e "$dir" ] || continue
              before=$(avail_kb /)
              sudo rm -rf "$dir"
              echo "  $dir ($(gb $(($(avail_kb /) - before))) GB)"
            done
            lab=$HOME/molecule-lab
            echo "MOLECULE_LAB_DIR=$lab" >> "$GITHUB_ENV"
          fi
          # The lab directory doesn't exist yet (setup-molecule creates it).
          free_kb=$(avail_kb "$(dirname "$lab")")
          echo "Lab directory: $lab, on $(df -P "$(dirname "$lab")" | awk 'NR == 2 {print $1}'), $(gb "$free_kb") GB free"
          if [ "$free_kb" -lt "$need_kb" ]; then
            echo "::warning::Only $(gb "$free_kb") GB free for the lab ($lab); it may run out of room. Re-run the job if it does."
          fi

      # Python packages and collections at the versions of the ansible-runtime image (RUNTIME_IMAGE
      # in ci.yml): its constraints.txt and its collections, the same ansible-core, Molecule, linters,
      # pypsrp and collections every consumer runs. This repo's CI never runs IN the image (it would
      # test the baked driver). requirements.yml is then a check against the image's collections.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collection: git_cgallagher.molecule
          collections-image: ${{ steps.runtime.outputs.image }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
          kvm: 'true'
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}

      # --destroy=never: keep the VM for the diagnostics below; the last step
      # destroys it either way. A hang must become a failure, so the screen
      # capture runs.
      - name: molecule test
        timeout-minutes: 75
        run: molecule test -s ${{ matrix.scenario }} --destroy=never

      # What the lab used (the box image, each VM's copy-on-write disk) and
      # the room left, before destroy deletes the VM disks. QEMU pauses a VM
      # whose disk runs out of room: the screen capture below then reports
      # "VM status: paused (io-error)".
      - name: Show the lab's disk use
        if: always()
        timeout-minutes: 2
        run: |
          du -sch "$MOLECULE_LAB_DIR"/* || true
          df -h "$MOLECULE_LAB_DIR" || true

      # Separates "a hub never ran or died" from "frames don't cross" from
      # "Windows' firewall" when a lab network test fails.
      - name: Show the lab network hubs
        if: failure()
        timeout-minutes: 1
        run: |
          ss -ulnp | grep -i python || true
          for f in "$MOLECULE_LAB_DIR"/hub-*.pid; do [ -f "$f" ] && echo "$f: $(cat "$f")"; done
          ps -eo pid,args | grep '[l]ab_hub' || true

      - name: Capture the VM screen
        if: failure()
        timeout-minutes: 2
        uses: ./.github/actions/vm-screendump
        with:
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}
          platforms: ${{ matrix.platforms }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-lab-${{ matrix.scenario }}-diagnostics
          path: |
            ${{ env.MOLECULE_LAB_DIR }}/*-screen.ppm
            ${{ env.MOLECULE_LAB_DIR }}/*-qemu.log
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        run: molecule destroy -s ${{ matrix.scenario }}

  lifecycle:
    name: windows_vm lifecycle
    runs-on: ubuntu-latest
    # Usually about a minute; room for setup-molecule's apt (10 minutes at
    # most, with a slow mirror), the image pull and the test's own 5.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # QEMU and pypsrp, as for the scenarios.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collection: git_cgallagher.molecule
          collections-image: ${{ steps.runtime.outputs.image }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
          kvm: 'true'
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}

      - name: QEMU supervisor and first-boot poll
        timeout-minutes: 5
        run: .github/ci/windows_vm_lifecycle.sh
