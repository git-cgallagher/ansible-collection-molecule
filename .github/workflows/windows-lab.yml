name: windows-lab

# The windows_vm kind end to end, on QEMU/KVM on the runner:
#   windows_dc       a Windows Server 2022 VM promoted to a new forest with
#                    Microsoft DNS by ad_forest; a host-network container
#                    queries it through the forwarded port.
#   windows_cluster  two VMs booted side by side on one lab network; each
#                    reaches the other over it.
# About 15-25 min each, in parallel. And, in a few minutes without a box:
#   lifecycle        QEMU under files/qemu_supervisor.py and each answer of
#                    files/first_boot_poll.py, against a disk-less QEMU
#                    (.github/ci/windows_vm_lifecycle.sh).
#
# Every job takes its collections from the ansible-runtime image (RUNTIME_IMAGE
# in ci.yml, through setup-molecule's collections-image) and runs with Galaxy
# unreachable, so nothing in it can download a collection.
#
# Not a required check: it is path-filtered (a required check that doesn't
# run blocks merges forever) and depends on a third-party box download.

on:
  pull_request:
    paths:
      - roles/windows_vm/**
      - roles/ad_forest/**
      - roles/quiet_vm/**
      - roles/docker/**
      - playbooks/**
      - molecule_git_cgallagher/**
      - extensions/molecule/windows_dc/**
      - extensions/molecule/windows_cluster/**
      - extensions/molecule/tasks/**
      - .github/actions/**
      - .github/ci/windows_vm_lifecycle.sh
      - .github/workflows/windows-lab.yml
  # Weekly: catches box and runner-image changes (collections change only with RUNTIME_IMAGE).
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: windows-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output (retry lines included) instead of buffering it
  # until the play ends; a stalled step is then visible in the live log.
  PYTHONUNBUFFERED: '1'

jobs:
  molecule:
    name: molecule ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: windows_dc
            platforms: dc01
          - scenario: windows_cluster
            platforms: node1 node2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner's temp disk: the box (~6 GB, plus ~6 GB while unpacking)
      # and the VM disk don't fit on the ~14 GB root filesystem.
      # Python packages and collections at the versions of the ansible-runtime image (RUNTIME_IMAGE
      # in ci.yml): its constraints.txt and its collections, the same ansible-core, Molecule, linters,
      # pypsrp and collections every consumer runs. This repo's CI never runs IN the image (it would
      # test the baked driver). requirements.yml is then a check against the image's collections.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collection: git_cgallagher.molecule
          collections-image: ${{ steps.runtime.outputs.image }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
          kvm: 'true'
          lab-dir: /mnt/molecule-lab

      # --destroy=never: keep the VM for the diagnostics below; the last step
      # destroys it either way. A hang must become a failure, so the screen
      # capture runs.
      - name: molecule test
        timeout-minutes: 75
        run: molecule test -s ${{ matrix.scenario }} --destroy=never

      # Separates "a hub never ran or died" from "frames don't cross" from
      # "Windows' firewall" when a lab network test fails.
      - name: Show the lab network hubs
        if: failure()
        timeout-minutes: 1
        run: |
          ss -ulnp | grep -i python || true
          for f in /mnt/molecule-lab/hub-*.pid; do [ -f "$f" ] && echo "$f: $(cat "$f")"; done
          ps -eo pid,args | grep '[l]ab_hub' || true

      - name: Capture the VM screen
        if: failure()
        timeout-minutes: 2
        uses: ./.github/actions/vm-screendump
        with:
          lab-dir: /mnt/molecule-lab
          platforms: ${{ matrix.platforms }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-lab-${{ matrix.scenario }}-diagnostics
          path: |
            /mnt/molecule-lab/*-screen.ppm
            /mnt/molecule-lab/*-qemu.log
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        run: molecule destroy -s ${{ matrix.scenario }}

  lifecycle:
    name: windows_vm lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # QEMU and pypsrp, as for the scenarios.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ci.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ci.yml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
      - name: Block Galaxy
        run: |
          printf '0.0.0.0 galaxy.ansible.com\n:: galaxy.ansible.com\n' | sudo tee -a /etc/hosts
      - uses: ./.github/actions/setup-molecule
        with:
          collection: git_cgallagher.molecule
          collections-image: ${{ steps.runtime.outputs.image }}
          requirements: extensions/molecule/requirements.yml
          constraints: .cache/constraints.txt
          kvm: 'true'
          lab-dir: /mnt/molecule-lab

      - name: QEMU supervisor and first-boot poll
        timeout-minutes: 5
        run: .github/ci/windows_vm_lifecycle.sh
