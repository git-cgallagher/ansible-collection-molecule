[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "molecule-git-cgallagher"
version = "0.3.2"
description = "Molecule driver for git_cgallagher.molecule: Docker containers and QEMU/KVM Windows VMs from platform definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Gallagher" }]
requires-python = ">=3.10"
dependencies = ["molecule>=25.1"]

[project.optional-dependencies]
# The windows_vm kind's first-boot poll and Ansible's psrp connection.
windows = ["pypsrp>=0.8"]

[project.entry-points."molecule.driver"]
molecule-git-cgallagher = "molecule_git_cgallagher.driver:GitCgallagherDriver"

[project.urls]
Repository = "https://github.com/git-cgallagher/ansible-collection-molecule"

[tool.setuptools]
packages = ["molecule_git_cgallagher"]

[tool.setuptools.package-data]
molecule_git_cgallagher = ["playbooks/*.yml", "schema/*.json"]
