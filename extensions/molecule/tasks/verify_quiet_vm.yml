---
# Shared by the windows_dc and windows_cluster verifies: the state quiet_vm
# claims, read back without it.
- name: Read the Windows Update service
  ansible.windows.win_service_info:
    name: wuauserv
  register: quiet_wuauserv

- name: Read Defender's real-time scanning preference
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      [bool](Get-MpPreference).DisableRealtimeMonitoring
  register: quiet_defender

# quiet_vm_wuauserv_stopped comes from the last converge through the
# scenario's fact cache (ANSIBLE_CACHE_PLUGIN in molecule.yml). Stopped is
# required unless quiet_vm warned that Windows refused the stop.
- name: Require Windows Update disabled (and stopped unless quiet_vm warned), and real-time scanning off
  ansible.builtin.assert:
    that:
      - ansible_facts.quiet_vm_wuauserv_stopped is defined
      - quiet_wuauserv.services[0].start_mode == 'disabled'
      - quiet_wuauserv.services[0].state == 'stopped' or not (ansible_facts.quiet_vm_wuauserv_stopped | bool)
      - quiet_defender.output[0]
    fail_msg: >-
      {{ quiet_wuauserv.services[0] | to_json }} / stopped fact
      {{ ansible_facts.quiet_vm_wuauserv_stopped | default('missing') }} / defender {{ quiet_defender.output }}
