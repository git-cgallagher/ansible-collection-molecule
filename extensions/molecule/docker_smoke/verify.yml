---
- name: Check the instance config Molecule built the inventory from
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the instance config
      ansible.builtin.set_fact:
        smoke_instances: "{{ lookup('ansible.builtin.file', molecule_instance_config) | from_yaml }}"

    - name: Require one docker-connection entry per platform
      ansible.builtin.assert:
        that:
          - smoke_instances | map(attribute='instance') | sort == ['molecule-smoke1', 'molecule-smoke2']
          - smoke_instances | map(attribute='connection') | unique == ['community.docker.docker']
        fail_msg: "{{ smoke_instances | to_json }}"

- name: Check the platform options reached docker run
  hosts: molecule-smoke2
  gather_facts: false
  tasks:
    - name: Read the hostname
      ansible.builtin.command: hostname
      register: smoke_hostname
      changed_when: false

    - name: Require the platform's hostname
      ansible.builtin.assert:
        that: smoke_hostname.stdout == 'smoke2.example.test'

- name: Check platform_defaults reached a platform that sets no keys of its own
  hosts: molecule-smoke1
  gather_facts: false
  tasks:
    - name: Read the Python version
      ansible.builtin.command: python3 --version
      register: smoke_python
      changed_when: false

    - name: Require the default image (python:3.13-slim)
      ansible.builtin.assert:
        that: smoke_python.stdout is match('Python 3\\.13\\.')
        fail_msg: "{{ smoke_python.stdout }}"
